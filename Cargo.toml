[package]
name = "openpgp-sign-kms"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "GnuPG-compatible OpenPGP signing with AWS KMS"
repository = "https://github.com/duncm/openpgp-sign-kms-cli"

[dependencies]
anyhow = "1"
aws-config = "1.12"
aws-sdk-kms = { version = "1.123", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-openssl"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = "thin"
