name: AWS integration
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
      id-token: write
    environment: integration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Trusted source only
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require environment configuration
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: test -n "$ROLE" && test -n "$REGION"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.candidate
        with:
          name: cli-${{ matrix.target }}
          path: dist
      - name: Build development candidate
        if: ${{ !inputs.candidate }}
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config clang libclang-dev perl
          cargo build --release --locked
          mkdir -p dist/test
          cp target/release/openpgp-sign-kms dist/test/
      - name: Extract release candidate
        if: inputs.candidate
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/test
          tar -xzf dist/openpgp-sign-kms-*-"$TARGET".tar.gz -C dist/test
      - id: credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: kms-integration-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create temporary keys
        id: keys
        env:
          KMS_TEST_JOB: test-${{ matrix.target }}
        run: python3 scripts/kms-test-keys.py create --kind RSA --kind ED25519 --state "$RUNNER_TEMP/kms-test-keys.jsonl"
      - name: Sign, verify and check CloudTrail
        run: python3 scripts/live.py "$PWD/dist/test/openpgp-sign-kms"
      - name: Refresh cleanup credentials
        if: ${{ always() && steps.credentials.outcome == 'success' && steps.keys.outcome != 'skipped' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: kms-cleanup-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Schedule temporary key deletion
        if: ${{ always() && steps.credentials.outcome == 'success' && steps.keys.outcome != 'skipped' }}
        timeout-minutes: 15
        env:
          KMS_TEST_JOB: test-${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kms-test-keys.py cleanup --state "$RUNNER_TEMP/kms-test-keys.jsonl" 2>&1 | tee "$RUNNER_TEMP/kms-key-cleanup.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: key-cleanup-${{ matrix.target }}
          path: ${{ runner.temp }}/kms-key-cleanup.log
