name: Maintenance
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check licenses sources
      - run: python3 scripts/check-docs.py --external
