name: Maintenance
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check licenses sources
      - run: python3 scripts/check-docs.py --external
