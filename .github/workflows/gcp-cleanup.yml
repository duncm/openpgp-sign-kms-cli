name: Google orphan version cleanup
on:
  schedule:
    - cron: '13 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report eligible versions without destroying them
        type: boolean
        default: true
      recover_versions:
        description: Optional JSON array of exact version names to clean up regardless of age
        type: string
        default: '[]'
permissions:
  contents: read
concurrency:
  group: gcp-orphan-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    environment: gcp-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: us-central1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate with Google OIDC
        id: credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Sweep expired versions
        env:
          RECOVERY_VERSIONS: ${{ inputs.recover_versions || '[]' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          {
            python3 scripts/gcp-test-keys.py recover --versions-json "$RECOVERY_VERSIONS" "${args[@]}"
            python3 scripts/gcp-test-keys.py sweep "${args[@]}"
          } 2>&1 | tee gcp-cleanup-report.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gcp-orphan-cleanup-report
          path: gcp-cleanup-report.log
